<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>TRÚC MINH | QR SCAN</title>
<style>
:root{
  --peach:#FFBFA8;
  --teal:#40D2CC;
  --darkTeal:#087F78;
  --text:#233344;
  --muted:#64748B;
  --okBg:#DDF5F1;
  --otherBg:#F1F2F4;
}
*{box-sizing:border-box}
body{
  margin:0;
  padding:14px;
  padding-top:calc(14px + env(safe-area-inset-top));
  background:
    radial-gradient(circle at top left,#ffe6d8,transparent 55%),
    radial-gradient(circle at top right,#defaf6,transparent 55%),
    #fffdfb;
  color:var(--text);
  font-family:system-ui,-apple-system,"Segoe UI",Arial,sans-serif;
}
main{max-width:920px;margin:auto;display:grid;gap:14px}
header,.panel{
  border-radius:22px;
  padding:17px;
  box-shadow:0 8px 24px #26334412;
}
header{
  background:linear-gradient(125deg,#FFD08A,#FFBFA8);
}
header h1{color:white;margin:0;font-size:25px}
header p{margin:9px 0 0;color:#614d48;font-weight:750}
.panel{
  background:#fbece6;
  border:1px solid #f5e7e1;
}
h2{
  margin:0 0 14px;
  font-size:17px;
  color:#475569;
}
label{display:block;font-size:14px;font-weight:800;margin-bottom:7px}
input,select,button{font:inherit}
input,select{
  width:100%;
  min-height:49px;
  padding:10px;
  border-radius:13px;
  background:white;
  border:1px solid #dedfe3;
  outline:none;
}
input:focus,select:focus{
  border-color:var(--teal);
  box-shadow:0 0 0 3px #40d2cc33;
}
.infoGrid{display:grid;grid-template-columns:1fr 1.65fr;gap:12px}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:7px;margin-top:13px}
.stat{
  text-align:center;
  padding:9px 3px;
  border-radius:13px;
  background:white;
  font-size:13px;
  font-weight:800;
}
.stat b{font-size:20px;margin-left:5px}
#pxkInfo{
  margin-top:12px;
  padding:11px;
  border-radius:13px;
  background:#e6f7f1;
  color:#087f78;
  font-weight:800;
  overflow-wrap:anywhere;
  font-size:13px;
}
.scanArea{
  padding:14px;
  border-radius:17px;
  background:linear-gradient(135deg,#f5fffd,#fff3ec);
  border:1px solid #b9e6df;
  position:relative;
}
.actions{display:grid;grid-template-columns:1fr auto;gap:9px}
button{
  border:0;
  min-height:53px;
  border-radius:15px;
  padding:10px 15px;
  cursor:pointer;
  font-weight:900;
}
#start{
  color:white;
  background:
    linear-gradient(135deg,#25beb8,#ffa58e);
  box-shadow:0 8px 20px #1ba9a533;
}
#stop{
  background:linear-gradient(135deg,#ef4444,#f97316);
  color:white;
}
button:disabled{opacity:.4;cursor:default}
button:active:not(:disabled){transform:scale(.975)}
#scanInput{
  margin-top:10px;
  min-height:45px;
  text-align:center;
  border:2px solid var(--teal);
  font-size:13px;
}
.hint{
  color:var(--muted);
  font-size:12px;
  line-height:1.4;
  margin:10px 0 0;
}
#status{
  margin-top:13px;
  padding:15px 10px;
  background:white;
  text-align:center;
  border-radius:14px;
  font-size:15px;
  font-weight:900;
  overflow-wrap:anywhere;
}
#status.ok{background:#ddf5f1;color:#087f78}
#status.skip{background:#f1f2f4;color:#58616c}
#status.err{background:#f1f2f4;color:#c62828}
.listHeader{
  display:flex;
  justify-content:space-between;
  gap:10px;
  align-items:center;
  margin:4px 0 12px;
}
.listHeader h2{margin:0}
#total{font-size:12px;color:var(--muted)}
.columns{
  display:grid;
  grid-template-columns:minmax(0,1fr) minmax(0,1fr);
  gap:10px;
  align-items:start;
}
.col{min-width:0}
.colTitle{
  text-align:center;
  font-weight:950;
  font-size:14px;
  margin-bottom:10px;
}
.cards{
  display:grid;
  gap:10px;
  align-content:start;
}
.temCard{
  min-width:0;
  border-radius:16px;
  padding:12px;
  border:1px solid #dde4e8;
  background:#fff;
  overflow-wrap:anywhere;
  animation:appear .22s ease-out;
  box-shadow:0 1px 0 rgba(0,0,0,.02);
}
.temCard.ok{
  background:#dff3eb;
  border-color:#bfe5d7;
}
.temCard.skip,
.temCard.err{
  background:#f3f5f7;
  border-color:#dde3e8;
}
@keyframes appear{
  from{opacity:0;transform:translateY(-6px)}
  to{opacity:1;transform:translateY(0)}
}
.temHead{
  display:flex;
  justify-content:space-between;
  align-items:flex-start;
  gap:8px;
  font-weight:950;
  font-size:14px;
}
.temHead .tag{
  line-height:1.2;
}
.temHead time{
  color:#7a8693;
  font-size:10px;
  font-weight:700;
  white-space:nowrap;
}
.temCard.ok .tag{color:#087f78}
.temCard.skip .tag{color:#58616c}
.temCard.err .tag{color:#c62828}

.temBody{
  border-top:1px solid rgba(96,127,121,.16);
  padding-top:8px;
  margin-top:8px;
}
.temLine{
  font-size:12px;
  line-height:1.42;
  padding:2px 0;
  white-space:pre-wrap;
  overflow-wrap:anywhere;
}
.temLine.product{
  font-weight:950;
}
.temFooter{
  border-top:1px solid rgba(96,127,121,.16);
  margin-top:8px;
  padding-top:8px;
  color:#5b6771;
  font-size:11px;
}
.temStepsWrap{
  border-top:1px solid rgba(96,127,121,.16);
  margin-top:8px;
  padding-top:8px;
}
.temMiniLabel{
  font-size:10px;
  font-weight:900;
  color:#60707c;
  margin-bottom:6px;
  text-transform:uppercase;
  letter-spacing:.02em;
}
.temSteps{
  display:flex;
  flex-wrap:wrap;
  gap:4px;
}
.temSteps span{
  padding:4px 7px;
  border-radius:999px;
  background:#ffffffc7;
  border:1px solid #cfe5df;
  font-size:10px;
  font-weight:900;
  line-height:1.1;
}
.temNote{
  margin-top:8px;
  color:#56636f;
  font-size:11px;
  line-height:1.4;
}
.temNote:empty{
  display:none;
}
#toast{
  position:fixed;
  left:50%;
  bottom:calc(22px + env(safe-area-inset-bottom));
  transform:translate(-50%,20px);
  z-index:30;
  width:min(90vw,420px);
  padding:13px 18px;
  border-radius:17px;
  background:#fff;
  box-shadow:0 12px 35px #0003;
  border:1px solid #ddd;
  font-size:14px;
  font-weight:850;
  opacity:0;
  pointer-events:none;
  transition:opacity .2s,transform .2s;
}
#toast.show{
  opacity:1;
  transform:translate(-50%,0);
}
#toast.ok{border-color:#40d2cc}
#toast.err{border-color:#ddd}
#checkOverlay{
  position:fixed;
  inset:0;
  display:grid;
  place-items:center;
  pointer-events:none;
  opacity:0;
  z-index:25;
}
#checkOverlay.show{animation:showCheck .65s ease-out}
.checkCircle{
  width:125px;
  height:125px;
  background:#40d2cced;
  border:5px solid white;
  border-radius:50%;
  display:grid;
  place-items:center;
  color:white;
  font-size:77px;
  font-weight:900;
  box-shadow:0 15px 45px #087f7866;
}
@keyframes showCheck{
  0%{opacity:0;transform:scale(.65)}
  25%{opacity:1;transform:scale(1.08)}
  75%{opacity:1;transform:scale(1)}
  100%{opacity:0;transform:scale(1.05)}
}
@media(max-width:520px){
  body{padding:9px}
  header,.panel{padding:12px}
  .infoGrid{grid-template-columns:1fr 1.6fr;gap:8px}
  .columns{gap:7px}
  .temCard{padding:8px}
  .temLine{font-size:11px}
  .temHead{font-size:12px}
  .temSteps span{font-size:9px}
  .stats{gap:5px}
  .stat{font-size:11px}
  .stat b{font-size:16px}
}
</style>
</head>
<body>

<main>
  <header>
    <h1>QR SCAN - BÁO CÁO XƯỞNG</h1>
    <p>Quét QR trên TEM bằng máy scanner</p>
  </header>

  <section class="panel">
    <h2>🧑‍🏭 Thông tin</h2>
    <div class="infoGrid">
      <div>
        <label for="worker">Tên / SĐT</label>
        <input id="worker" autocomplete="off"
               placeholder="Tên công nhân">
      </div>
      <div>
        <label for="step">Công đoạn</label>
        <select id="step">
          <option value="">Đang tải...</option>
        </select>
      </div>
    </div>

    <div class="stats">
      <div class="stat">OK <b id="okCount">0</b></div>
      <div class="stat">SKIP <b id="skipCount">0</b></div>
      <div class="stat">ERROR <b id="errCount">0</b></div>
    </div>

    <div id="pxkInfo">Chưa mở PXK</div>
  </section>

  <section class="panel">
    <h2>🔎 Quét QR bằng KAW</h2>

    <div class="scanArea">
      <div class="actions">
        <button id="start">▶️ START</button>
        <button id="stop" disabled>⛔️ STOP</button>
      </div>

      <input id="scanInput"
             type="text"
             inputmode="none"
             lang="en"
             autocomplete="off"
             autocorrect="off"
             autocapitalize="none"
             spellcheck="false"
             placeholder="QR nhận từ scanner"
             disabled>

      <p class="hint">
        Chỉ dùng bàn phím Tiếng Anh (English).
      </p>
    </div>

    <div id="status" role="status" aria-live="polite">
      Chọn công đoạn rồi bắt đầu quét QR
    </div>
  </section>

  <section class="panel">
    <div class="listHeader">
      <h2>📋 Danh sách TEM bạn đã quét</h2>
      <span id="total">0 lượt quét</span>
    </div>

    <div class="columns">
      <div class="col">
        <div class="cards" id="okList"></div>
      </div>
      <div class="col">
        <div class="cards" id="otherList"></div>
      </div>
    </div>
  </section>
</main>

<div id="toast"></div>
<div id="checkOverlay">
  <div class="checkCircle">✓</div>
</div>

<script>
(() => {
  "use strict";

  const $ = id => document.getElementById(id);
  const query = new URLSearchParams(location.search);

  const apiBase = String(
    query.get("api") ||
    "https://tm-barcode-api-1060743715550.asia-southeast1.run.app"
  ).replace(/\/+$/, "");

  const sid = String(query.get("sid") || "").trim();
  const pxk = String(query.get("pxk") || "")
    .trim().toUpperCase();

  const company = String(query.get("co") || "").trim();
  const dateText = String(query.get("dt") || "").trim();

  const worker = $("worker");
  const step = $("step");
  const input = $("scanInput");

  const pending = [];
  const inFlight = new Set();
  const recent = new Map();

  const detailCache = new Map();
  const detailJobs = [];

  const counts = {OK:0, SKIP:0, ERROR:0};

  const stepOrder = [
    "GTAM","CAN","IN","CHAP","DAN","QC","KHO"
  ];

  let armed = false;
  let busy = false;
  let detailBusy = false;
  let audioContext = null;
  let toastTimer = null;

  worker.value =
    localStorage.getItem("TM_KAW_WORKER") || "";

  worker.addEventListener("change", () => {
    localStorage.setItem(
      "TM_KAW_WORKER",
      worker.value.trim()
    );
  });

  $("pxkInfo").textContent = pxk
    ? "PXK: " + pxk +
      (company ? " · " + company : "") +
      (dateText ? " · " + dateText : "")
    : "Chưa mở PXK bằng QR TEM";

  function setStatus(kind, message) {
    $("status").className = kind
      ? kind.toLowerCase()
      : "";
    $("status").textContent = message;
  }

  function showToast(message, kind) {
    const el = $("toast");
    el.textContent = message;
    el.className = "show " + kind;

    clearTimeout(toastTimer);
    toastTimer = setTimeout(() => {
      el.className = "";
    }, 1800);
  }

  function beep() {
    try {
      audioContext ||= new (
        window.AudioContext ||
        window.webkitAudioContext
      )();

      if (audioContext.state === "suspended") {
        audioContext.resume();
      }

      const oscillator =
        audioContext.createOscillator();

      const gain = audioContext.createGain();

      oscillator.type = "sine";
      oscillator.frequency.value = 1050;

      oscillator.connect(gain);
      gain.connect(audioContext.destination);

      gain.gain.setValueAtTime(
        0.1, audioContext.currentTime
      );

      gain.gain.exponentialRampToValueAtTime(
        0.001,
        audioContext.currentTime + 0.15
      );

      oscillator.start();
      oscillator.stop(audioContext.currentTime + 0.15);
    } catch (_) {}
  }

  function showCheck() {
    beep();
    navigator.vibrate?.([45,30,45]);

    const el = $("checkOverlay");

    el.classList.remove("show");
    void el.offsetWidth;
    el.classList.add("show");

    setTimeout(() => {
      el.classList.remove("show");
    }, 650);
  }

  function focusScanner() {
    if (
      armed &&
      !document.hidden &&
      document.activeElement !== input
    ) {
      input.focus({preventScroll:true});
    }
  }

  function parseQR(raw) {
    const value = String(raw || "").trim();
  
    if (!value) return null;
  
    let key = "";
    let qrSid = "";
    let qrPxk = "";
  
    // QR chứa URL mở trang GitHub
    if (/^https?:\/\//i.test(value)) {
      let url;
  
      try {
        url = new URL(value);
      } catch (_) {
        return null;
      }
  
      // Chấp nhận cả đường dẫn GitHub cũ và mới.
      if (
        url.protocol !== "https:" ||
        url.hostname !== "mthudangn.github.io"
      ) {
        return null;
      }
  
      key = String(url.searchParams.get("pk") || "").trim();
      qrSid = String(url.searchParams.get("sid") || "").trim();
      qrPxk = String(url.searchParams.get("pxk") || "")
        .trim().toUpperCase();
  
    } else {
      // KAW có thể trả trực tiếp mã sản phẩm.
      key = value;
    }
  
    // Chuẩn hóa định dạng cũ | sang ~ của Cloud Run V2.
    if (
      key.includes("|") &&
      !key.includes("~")
    ) {
      key = key.replace(/\|/g, "~");
    }
  
    const parts = key.split("~");
  
    if (
      parts.length < 3 ||
      parts.some(part => !part.trim()) ||
      !/^[a-z0-9]+$/i.test(parts[0])
    ) {
      return null;
    }
  
    return {
      pk: key,
      sid: qrSid,
      pxk: qrPxk || parts[0].toUpperCase()
    };
  }

  function compactKey(key) {
    const s = String(key || "");

    return s.length > 42
      ? s.slice(0,18) + "…" + s.slice(-15)
      : s;
  }

  function timeNow() {
    return new Intl.DateTimeFormat("vi-VN", {
      hour:"2-digit",
      minute:"2-digit",
      hour12:false
    }).format(new Date());
  }

  function updateCounts() {
    $("okCount").textContent = counts.OK;
    $("skipCount").textContent = counts.SKIP;
    $("errCount").textContent = counts.ERROR;

    $("total").textContent =
      (counts.OK + counts.SKIP + counts.ERROR) +
      " lượt quét";
  }

  function newCard(kind, key, message) {
  const card = document.createElement("article");
  card.className = "temCard " + kind.toLowerCase();

  const head = document.createElement("div");
  head.className = "temHead";

  const label = document.createElement("span");
  label.className = "tag";
  label.textContent =
    kind === "OK" ? "✅ OK" :
    kind === "SKIP" ? "❌ SKIP" :
    "❌ ERROR";

  const time = document.createElement("time");
  time.textContent = timeNow();

  head.append(label, time);

  const body = document.createElement("div");
  body.className = "temBody";

  const firstLine = document.createElement("div");
  firstLine.className = "temLine";
  firstLine.textContent = compactKey(key);
  body.append(firstLine);

  const note = document.createElement("div");
  note.className = "temNote";
  note.textContent = message || "";

  card.append(head, body, note);

  const list = kind === "OK"
    ? $("okList")
    : $("otherList");

  list.prepend(card);

  while (list.children.length > 20) {
    list.lastElementChild.remove();
  }

  updateCounts();
  return card;
}

function renderDetails(card, detail, key) {
  if (!card || !card.isConnected) return;

  const body = card.querySelector(".temBody");
  const note = card.querySelector(".temNote");

  body.replaceChildren();

  if (note) {
    note.textContent = "";
  }

  const tem = detail?.temPrint || {};
  const lines = [];

  for (const field of ["l1","l2","l3","l4","l5"]) {
    const value = String(tem[field] || "").trim();
    if (value) {
      lines.push(...value.split(/\r?\n/).map(x => x.trim()).filter(Boolean));
    }
  }

  if (!lines.length) {
    const fallback = document.createElement("div");
    fallback.className = "temLine";
    fallback.textContent = compactKey(key);
    body.append(fallback);
  } else {
    for (const line of lines) {
      const div = document.createElement("div");
      div.className = "temLine";

      if (/SK\s+SHOES\s+BOX/i.test(line)) {
        div.classList.add("product");
      }

      div.textContent = line;
      body.append(div);
    }
  }

  const footer = tem.footer || {};
  const footerParts = [];

  if (footer.khgh) footerParts.push("KHGH: " + footer.khgh);
  if (footer.stt) footerParts.push("STT: " + footer.stt);

  if (footerParts.length) {
    const footerDiv = document.createElement("div");
    footerDiv.className = "temFooter";
    footerDiv.textContent = footerParts.join(" · ");
    body.append(footerDiv);
  }

  const done = Array.isArray(detail?.doneBadges)
    ? detail.doneBadges.slice()
    : [];

  if (done.length) {
    done.sort((a, b) => {
      const va = String(a).toUpperCase();
      const vb = String(b).toUpperCase();

      const ia = stepOrder.findIndex(id => va.includes(id));
      const ib = stepOrder.findIndex(id => vb.includes(id));

      return (ia < 0 ? 999 : ia) - (ib < 0 ? 999 : ib);
    });

    const wrap = document.createElement("div");
    wrap.className = "temStepsWrap";

    const label = document.createElement("div");
    label.className = "temMiniLabel";
    label.textContent = "Đã quét";

    const group = document.createElement("div");
    group.className = "temSteps";

    for (const item of done) {
      const badge = document.createElement("span");
      badge.textContent = String(item);
      group.append(badge);
    }

    wrap.append(label, group);
    body.append(wrap);
  }
}

  async function getAPI(action, extras={}) {
    const url = new URL(apiBase + "/");

    url.searchParams.set("action", action);
    url.searchParams.set("sid", sid);

    for (const [key,value] of Object.entries(extras)) {
      url.searchParams.set(key,value);
    }

    const response = await fetch(url, {
      cache:"no-store"
    });

    const data = await response.json();

    if (!response.ok || !data.ok) {
      throw new Error(
        data.msg || data.error || "Lỗi API"
      );
    }

    return data;
  }

  async function loadSteps() {
    if (!sid) {
      step.replaceChildren(
        new Option("Thiếu sid trên QR", "")
      );

      setStatus(
        "ERROR",
        "Mở trang bằng QR TEM để chọn PXK"
      );
      return;
    }

    try {
      const data = await getAPI("getSteps");

      step.replaceChildren(
        new Option("--- Chọn công đoạn ---", "")
      );

      for (const item of data.steps || []) {
        step.add(new Option(
          item.label || item.id,
          item.id
        ));
      }
    } catch (error) {
      step.replaceChildren(
        new Option("Không tải được công đoạn","")
      );

      setStatus(
        "ERROR",
        "Lỗi tải công đoạn: " + error.message
      );
    }
  }

  function setArmed(value) {
    armed = value;

    $("start").disabled = value;
    $("stop").disabled = !value;

    worker.disabled = value;
    step.disabled = value;
    input.disabled = !value;
    input.value = "";

    if (value) {
      localStorage.setItem(
        "TM_KAW_WORKER",
        worker.value.trim()
      );

      setStatus(
        "",
        "Sẵn sàng — quét QR TEM bằng KAW"
      );

      focusScanner();
    } else {
      setStatus("", "Đã dừng nhận QR");
    }
  }

  $("start").addEventListener("click", () => {
    if (!sid || !pxk) {
      return setStatus(
        "ERROR",
        "Cần mở trang từ QR TEM có sid và pxk"
      );
    }

    if (!worker.value.trim()) {
      return setStatus(
        "ERROR",
        "Nhập tên / SĐT trước"
      );
    }

    if (!step.value) {
      return setStatus(
        "ERROR",
        "Chọn công đoạn trước"
      );
    }

    setArmed(true);
  });

  $("stop").addEventListener("click", () => {
    setArmed(false);
  });

  function accept(raw) {
    input.value = "";
    if (!armed) return;

    const data = parseQR(raw);

    if (!data || !data.pk) {
      counts.ERROR++;
    
      const card = newCard(
        "❌ ERROR",
        "",
        "Mã QR hoặc mã SP không hợp lệ"
      );
    
      card.querySelector(".temBody")?.remove();
    
      navigator.vibrate?.(120);
      return focusScanner();
    }

    const key = data.pk;

    if (
      key.split("~").length < 3 ||
      (data.pxk && data.pxk !== pxk) ||
      key.split("~")[0].toUpperCase() !== pxk
    ) {
      counts.ERROR++;

      newCard(
        "ERROR",
        key,
        "QR TEM không thuộc PXK đang mở"
      );

      setStatus(
        "ERROR",
        "❌ ERROR — QR sai PXK"
      );

      navigator.vibrate?.(120);
      return focusScanner();
    }

    const dedupeKey = step.value + "|" + key;
    const now = Date.now();

    if (
      inFlight.has(dedupeKey) ||
      (recent.get(dedupeKey) || 0) > now
    ) {
      return focusScanner();
    }

    inFlight.add(dedupeKey);

    pending.push({
      prodKey:key,
      step:step.value,
      workerInfo:worker.value.trim(),
      pxk,
      dedupeKey
    });

    setStatus(
      "",
      "Đang xử lý " + pending.length + " QR..."
    );

    drain();
    focusScanner();
  }

  input.addEventListener("keydown", event => {
    if (
      event.key === "Enter" ||
      event.key === "Tab"
    ) {
      event.preventDefault();

      if (input.value.trim()) {
        accept(input.value);
      }
    }
  });

  // Dự phòng khi KAW gửi phím mà ô nhập mất focus.
  let typed = "";
  let lastTyped = 0;

  document.addEventListener("keydown", event => {
    if (
      !armed ||
      document.activeElement === input ||
      document.activeElement === worker ||
      document.activeElement === step ||
      event.ctrlKey ||
      event.altKey ||
      event.metaKey
    ) {
      return;
    }

    if (event.key.length === 1) {
      if (Date.now() - lastTyped > 800) {
        typed = "";
      }

      typed += event.key;
      lastTyped = Date.now();

    } else if (
      (event.key === "Enter" ||
       event.key === "Tab") &&
      typed
    ) {
      event.preventDefault();

      const value = typed;
      typed = "";
      accept(value);
    }
  });

  function queueDetails(card, item) {
    if (detailCache.has(item.prodKey)) {
      renderDetails(
        card,
        detailCache.get(item.prodKey),
        item.prodKey
      );
      return;
    }

    detailJobs.push({card,item});
    loadDetails();
  }

  async function loadDetails() {
    if (detailBusy) return;
    detailBusy = true;

    while (detailJobs.length) {
      const {card,item} = detailJobs.shift();

      if (!card.isConnected) continue;

      try {
        const detail = await getAPI("fetchTem", {
          prodKey:item.prodKey,
          step:item.step,
          workerInfo:item.workerInfo,
          pxk:item.pxk
        });

        detailCache.set(item.prodKey, detail);

        renderDetails(
          card,
          detail,
          item.prodKey
        );

      } catch (error) {
        const note = card.querySelector(".temNote");

        if (note) {
          note.textContent +=
            " · Không tải được chi tiết TEM";
        }
      }
    }

    detailBusy = false;
  }

  async function drain() {
    if (busy) return;
    busy = true;

    while (pending.length) {
      const item = pending.shift();

      let kind = "ERROR";
      let message = "";

      try {
        const response = await fetch(apiBase + "/", {
          method:"POST",
          headers:{
            "Content-Type":"application/json"
          },
          body:JSON.stringify({
            action:"commit",
            sid,
            prodKey:item.prodKey,
            step:item.step,
            workerInfo:item.workerInfo,
            pxk:item.pxk
          })
        });

        const data = await response.json();

        kind =
          response.ok &&
          data.ok &&
          data.code === "OK"
            ? "OK"
            : data.code === "SKIP"
              ? "SKIP"
              : "ERROR";

        message =
          data.msg ||
          data.error ||
          data.code ||
          "HTTP " + response.status;

      } catch (error) {
        message =
          "Không xác nhận được kết quả. " +
          "Kiểm tra PXK trước khi quét lại: " +
          error.message;
      }

      counts[kind]++;

      if (kind === "OK") {
        showCheck();
        showToast(
          "✅ OK — đã ghi PXK",
          "ok"
        );
      } else if (kind === "SKIP") {
        showToast(
          "❌ SKIP — đã ghi nhận trước đó",
          ""
        );
      } else {
        navigator.vibrate?.(120);

        showToast(
          "❌ ERROR — " + message,
          "err"
        );
      }

      const card = newCard(
        kind,
        item.prodKey,
        message
      );

      setStatus(
        kind,
        (kind === "OK"
          ? "✅ OK"
          : kind === "SKIP"
            ? "❌ SKIP"
            : "❌ ERROR") +
        " — " + message
      );

      if (kind !== "ERROR") {
        queueDetails(card,item);
      }

      recent.set(
        item.dedupeKey,
        Date.now() + 1200
      );

      inFlight.delete(item.dedupeKey);
    }

    busy = false;
    focusScanner();
  }

  window.addEventListener("pagehide", () => {
    armed = false;
  });

  loadSteps();

})();
</script>
</body>
</html>
